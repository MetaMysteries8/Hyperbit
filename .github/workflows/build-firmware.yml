name: Build, Scan & Release HyperBit

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "pc_agent/**"
      - "tests/**"
      - "HyperBit.py"
      - "HI.md"
      - "INSTRUCTIONS.md"
      - "INFO.md"
      - "PROTOCOL.md"
      - "config.example.cmd"
      - "RUN_HYPERBIT.bat"
      - "TEST_BLE.bat"
      - "FLASH_FIRMWARE.bat"
      - "FLASH_FIRMWARE.ps1"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - "pc_agent/**"
      - "tests/**"
      - "HyperBit.py"
      - "HI.md"
      - "INSTRUCTIONS.md"
      - "INFO.md"
      - "PROTOCOL.md"
      - "config.example.cmd"
      - "RUN_HYPERBIT.bat"
      - "TEST_BLE.bat"
      - "FLASH_FIRMWARE.bat"
      - "FLASH_FIRMWARE.ps1"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

# Only the newest run for a branch/PR is useful. Rapid firmware iteration used
# to leave Actions compiling obsolete commits long after newer fixes existed.
concurrency:
  group: hyperbit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-scan-release:
    name: Compile, test, scan, package and release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout HyperBit
        uses: actions/checkout@v4

      - name: Install ARM/CODAL and security tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            cmake \
            ninja-build \
            git \
            python3 \
            python3-pip \
            rsync \
            zip \
            clamav \
            clamav-freshclam

          python3 -m pip install --upgrade pip
          python3 -m pip install bandit pip-audit

      - name: Update ClamAV signatures
        run: |
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam

      - name: Python syntax check
        run: |
          python3 -m compileall -q HyperBit.py pc_agent tests

      - name: Protocol and BLE regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist
          python3 -m unittest discover -s tests -v 2>&1 | tee dist/unit-tests.txt

      - name: Bandit static analysis
        run: |
          mkdir -p dist
          bandit -r pc_agent -ll -ii -f txt -o dist/security-bandit.txt
          bandit HyperBit.py -ll -ii -f txt -o dist/security-bandit-launcher.txt

      - name: Python dependency vulnerability audit
        run: |
          pip-audit -r pc_agent/requirements.txt -f json -o dist/security-pip-audit.json

      - name: ClamAV source scan
        shell: bash
        run: |
          set -o pipefail
          clamscan --recursive --infected \
            --exclude-dir='^\.git$' \
            --exclude-dir='^dist$' \
            . | tee dist/security-clamav-source.txt

      - name: Clone official micro:bit V2 CODAL samples
        run: |
          git clone --depth 1 \
            https://github.com/lancaster-university/microbit-v2-samples.git \
            .build/microbit-v2-samples

      - name: Inject HyperBit firmware
        run: |
          rm -rf .build/microbit-v2-samples/source/*
          cp firmware/source/* .build/microbit-v2-samples/source/
          cp firmware/codal.json .build/microbit-v2-samples/codal.json

      - name: Compile HyperBit.hex
        shell: bash
        working-directory: .build/microbit-v2-samples
        run: |
          set -o pipefail
          python3 build.py 2>&1 | tee ../../dist/firmware-build.log

      - name: Verify build provenance and BLE configuration
        shell: bash
        run: |
          set -euo pipefail

          # Prove the compiler saw the exact full firmware source tree and config
          # checked out from this HyperBit commit. Any stale/extra/mismatched file
          # in the injected sample project makes the release fail.
          diff -qr firmware/source .build/microbit-v2-samples/source
          cmp firmware/codal.json .build/microbit-v2-samples/codal.json

          # The nRF5 SDK has a macro path that can otherwise redefine OPEN_LINK
          # security to MITM. This warning is a release-blocking error.
          if grep -Fq '"MICROBIT_BLE_SECURITY_MODE" redefined' dist/firmware-build.log; then
            echo "ERROR: BLE security mode was redefined during compilation." >&2
            exit 1
          fi

          # The live Rainbow driver must stay on CODAL's hardware PWM path. Any
          # return of IRQ-masking NeoPixel code is a BLE-regression release block.
          if grep -Eq '__disable_irq|target_disable_irq|target_enable_irq' firmware/source/WukongRainbow.*; then
            echo "ERROR: Wukong Rainbow driver masks interrupts." >&2
            exit 1
          fi
          grep -Fq 'neopixel_send_buffer' firmware/source/WukongRainbow.cpp

          ELF=.build/microbit-v2-samples/build/MICROBIT
          test -f "$ELF"

          # CODAL's softdevice linker script intentionally expands .heap until
          # RAM_END - 0x800, so the generic GNU 'RAM % used' number is expected
          # to stay around 98.33% and is NOT a measure of free heap. Measure the
          # real heap capacity from __end__ (start of .heap) instead.
          END_HEX="$(arm-none-eabi-nm -n "$ELF" | awk '$3 == "__end__" {print $1; exit}')"
          test -n "$END_HEX"
          STATIC_END=$((0x${END_HEX}))
          RAM_START=$((0x20002040))
          RAM_END=$((0x20020000))
          STACK_RESERVE=$((0x800))
          HEAP_LIMIT=$((RAM_END - STACK_RESERVE))
          STATIC_RAM_BYTES=$((STATIC_END - RAM_START))
          HEAP_CAPACITY_BYTES=$((HEAP_LIMIT - STATIC_END))

          if (( HEAP_CAPACITY_BYTES <= 0 )); then
            echo "ERROR: no CODAL heap capacity remains after static allocations." >&2
            exit 1
          fi

          PROTOCOL_VERSION="$(awk '$1 == "#define" && $2 == "HYPERBIT_PROTOCOL_VERSION" {print $3}' firmware/source/VoiceBLEService.h)"
          FIRMWARE_REVISION="$(awk '$1 == "#define" && $2 == "HYPERBIT_FIRMWARE_REVISION" {print $3}' firmware/source/VoiceBLEService.h)"
          test -n "$PROTOCOL_VERSION"
          test -n "$FIRMWARE_REVISION"

          CODAL_COMMIT="$(git -C .build/microbit-v2-samples/libraries/codal-microbit-v2 rev-parse HEAD)"
          FIRMWARE_TREE_SHA="$(find firmware/source -maxdepth 1 -type f -printf '%f\0' | sort -z | while IFS= read -r -d '' f; do sha256sum "firmware/source/$f"; done | sha256sum | awk '{print $1}')"
          {
            echo "HyperBit build provenance"
            echo "github_commit=${GITHUB_SHA}"
            echo "github_run=${GITHUB_RUN_NUMBER}"
            echo "hyperbit_protocol_version=${PROTOCOL_VERSION}"
            echo "hyperbit_firmware_revision=${FIRMWARE_REVISION}"
            echo "codal_commit=${CODAL_COMMIT}"
            echo "codal_requested_branch=$(python3 -c 'import json; print(json.load(open("firmware/codal.json"))["target"]["branch"])')"
            echo "firmware_source_tree_sha256=${FIRMWARE_TREE_SHA}"
            echo "main_cpp_sha256=$(sha256sum firmware/source/main.cpp | awk '{print $1}')"
            echo "voice_cpp_sha256=$(sha256sum firmware/source/VoiceBLEService.cpp | awk '{print $1}')"
            echo "voice_h_sha256=$(sha256sum firmware/source/VoiceBLEService.h | awk '{print $1}')"
            echo "mic_recorder_h_sha256=$(sha256sum firmware/source/MicRecorder.h | awk '{print $1}')"
            echo "rainbow_cpp_sha256=$(sha256sum firmware/source/WukongRainbow.cpp | awk '{print $1}')"
            echo "codal_json_sha256=$(sha256sum firmware/codal.json | awk '{print $1}')"
            echo "pc_ble_link_sha256=$(sha256sum pc_agent/ble_link.py | awk '{print $1}')"
            echo "static_ram_end=0x${END_HEX}"
            echo "static_ram_bytes=${STATIC_RAM_BYTES}"
            echo "codal_heap_capacity_bytes=${HEAP_CAPACITY_BYTES}"
            echo "stack_reserve_bytes=${STACK_RESERVE}"
            echo
            echo "GNU linker region summary (includes CODAL's fill-to-limit .heap section):"
            grep -E '^[[:space:]]+(FLASH|RAM):' dist/firmware-build.log || true
          } > dist/BUILD_PROVENANCE.txt

          cat dist/BUILD_PROVENANCE.txt

      - name: Build release ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f .build/microbit-v2-samples/MICROBIT.hex

          rm -rf dist/release
          mkdir -p dist/release/pc_agent

          cp .build/microbit-v2-samples/MICROBIT.hex dist/HyperBit.hex
          cp dist/HyperBit.hex dist/release/HyperBit.hex

          cp HyperBit.py dist/release/HyperBit.py
          cp HI.md dist/release/HI.md
          cp INSTRUCTIONS.md dist/release/INSTRUCTIONS.md
          cp INFO.md dist/release/INFO.md
          cp PROTOCOL.md dist/release/PROTOCOL.md
          cp config.example.cmd dist/release/config.example.cmd
          cp RUN_HYPERBIT.bat dist/release/RUN_HYPERBIT.bat
          cp TEST_BLE.bat dist/release/TEST_BLE.bat
          cp FLASH_FIRMWARE.bat dist/release/FLASH_FIRMWARE.bat
          cp FLASH_FIRMWARE.ps1 dist/release/FLASH_FIRMWARE.ps1
          cp dist/BUILD_PROVENANCE.txt dist/release/BUILD_PROVENANCE.txt

          cp pc_agent/*.py dist/release/pc_agent/
          cp pc_agent/requirements.txt dist/release/requirements.txt

          cat > dist/release/SECURITY_SCAN.md <<EOF
          # HyperBit Release Verification

          This release is produced only after the GitHub Actions pipeline successfully completes all configured gates:

          - Python bytecode/syntax compilation check.
          - Protocol/BLE regression unit tests.
          - Bandit static analysis for medium-or-higher severity findings with medium-or-higher confidence.
          - pip-audit dependency vulnerability audit.
          - ClamAV recursive scan of the checked-out HyperBit source/package scripts.
          - Successful CODAL/GNU Arm compilation of the micro:bit V2 firmware.
          - Verification that the entire injected firmware source tree byte-matches this commit.
          - Verification that BLE security mode was not redefined during compilation.
          - Verification that the Rainbow driver uses the non-IRQ-masking hardware path.
          - Extraction of actual CODAL heap capacity from the linked ELF.
          - ClamAV scan of the final release ZIP and HEX before publication.

          Release build: ${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA}

          Automated scanning and regression tests substantially improve release hygiene, but no automated check can prove the absence of every possible defect or unsafe behavior.
          EOF

          (cd dist/release && zip -qr ../HyperBit-release.zip .)

      - name: ClamAV final package scan
        shell: bash
        run: |
          set -o pipefail
          clamscan --infected dist/HyperBit.hex dist/HyperBit-release.zip \
            | tee dist/security-clamav-package.txt

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum HyperBit.hex HyperBit-release.zip > CHECKSUMS.sha256

      - name: Prepare release notes
        shell: bash
        run: |
          cat > dist/RELEASE_NOTES.md <<EOF
          # HyperBit automated build ${GITHUB_RUN_NUMBER}

          Built from commit ${GITHUB_SHA}.

          ## Downloads

          - **HyperBit-release.zip** — recommended package. Contains compiled firmware, Windows launchers, Python agent, docs, config template, BLE diagnostic helper, flashing helpers, and build provenance.
          - **HyperBit.hex** — firmware only for a BBC micro:bit V2.
          - **BUILD_PROVENANCE.txt** — exact commit/source-tree hashes/CODAL commit, firmware revision, and real heap-capacity measurement used by the firmware build.
          - **CHECKSUMS.sha256** — SHA-256 checksums for the firmware and ZIP.

          ## Diagnostics

          Run **TEST_BLE.bat** to validate only Bluetooth/NUS/firmware identity without a Hyper API key, STT, model call, or TTS.

          ## Hardware controls

          - Gold logo: hold to talk; microphone is physically enabled only while held.
          - A: cancel/interrupt.
          - B: replay last answer.
          - A+B: mute/unmute.
          - Wukong base + hardware-PWM Rainbow LEDs: physical agent-state display.

          ## Release gates

          This release was published only after syntax checks, protocol/BLE regression tests, Bandit static analysis, dependency auditing, ClamAV source/package scans, full source-tree provenance checks, BLE security-config verification, safe Rainbow-driver verification, real heap-capacity extraction, and the micro:bit V2 firmware build completed successfully.
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperBit-build-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/HyperBit.hex
            dist/HyperBit-release.zip
            dist/CHECKSUMS.sha256
            dist/BUILD_PROVENANCE.txt
            dist/firmware-build.log
            dist/unit-tests.txt
            dist/release/SECURITY_SCAN.md
            dist/security-*.txt
            dist/security-*.json

      - name: Create automatic GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            dist/HyperBit-release.zip \
            dist/HyperBit.hex \
            dist/CHECKSUMS.sha256 \
            dist/BUILD_PROVENANCE.txt \
            dist/unit-tests.txt \
            dist/security-bandit.txt \
            dist/security-bandit-launcher.txt \
            dist/security-pip-audit.json \
            dist/security-clamav-source.txt \
            dist/security-clamav-package.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HyperBit Build ${GITHUB_RUN_NUMBER}" \
            --notes-file dist/RELEASE_NOTES.md \
            --latest

      - name: Build summary
        run: |
          echo "### HyperBit build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firmware compiled: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python syntax check: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Protocol/BLE regression tests: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bandit static analysis: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dependency audit: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- ClamAV source scan: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full firmware source-tree provenance verified: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- BLE security macro conflict absent: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Safe hardware-PWM Rainbow path verified: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Real CODAL heap capacity extracted: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- ClamAV release scan: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256 checksums generated: ✅" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "- GitHub Release: ✅ build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          fi
